services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: messagepusher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: messagepusher
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messagepusher -d messagepusher"]
      interval: 5s
      timeout: 5s
      retries: 15
  messagepusher:
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://messagepusher:${POSTGRES_PASSWORD}@postgres:5432/messagepusher
      BIND_ADDRESS: 0.0.0.0:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CONFIG_KEY_BASE64: ${CONFIG_KEY_BASE64:?Set CONFIG_KEY_BASE64 in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      RUST_LOG: ${RUST_LOG:-messagepusher=info}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
